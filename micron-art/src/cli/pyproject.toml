[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micronart"
version = "0.1.0"
description = "Convert ASCII/ANSI art into NomadNet Micron markup"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "../../LICENSE" }
# Zero runtime dependencies, matching the browser build.
dependencies = []

[project.scripts]
micronart = "micronart.__main__:main"

[tool.setuptools]
packages = ["micronart"]
