<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>micron-art</title>
    <meta
      name="description"
      content="Convert ASCII and ANSI art into NomadNet Micron markup."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>micron-art</h1>
      <p class="tagline">ASCII and ANSI art to NomadNet Micron markup</p>
    </header>
    <main>
      <section class="panel" aria-labelledby="art-heading">
        <div class="panel-head">
          <h2 id="art-heading">Art</h2>
          <div class="panel-actions">
            <label class="file-button">
              Load file
              <input id="file" type="file" accept=".txt,.ans,.asc,text/*" />
            </label>
            <button id="sample" type="button">Sample</button>
            <button id="clear" type="button">Clear</button>
          </div>
        </div>
        <textarea
          id="art"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          placeholder="Paste ASCII art, or pipe chafa output into a file and load it."
        ></textarea>
      </section>

      <section class="panel" aria-labelledby="output-heading">
        <div class="panel-head">
          <h2 id="output-heading">Micron</h2>
          <div class="segmented" role="radiogroup" aria-label="Output mode">
            <label><input type="radio" name="mode" value="literal" checked /><span>Monochrome</span></label>
            <label><input type="radio" name="mode" value="escaped" /><span>Keep Color</span></label>
          </div>
          <div class="panel-actions">
            <button id="copy" type="button">Copy</button>
            <button id="download" type="button">Download .mu</button>
          </div>
        </div>
        <textarea id="output" readonly spellcheck="false"></textarea>
        <div id="warnings" class="warnings" role="status" hidden></div>
      </section>

      <section class="panel" aria-labelledby="preview-heading">
        <div class="panel-head">
          <h2 id="preview-heading">NomadNet Preview</h2>
        </div>
         <p class="hint">
          Rendered through Micron. 
          <strong>Monochrome</strong> writes <code>literal</code> mode,
          <strong>Keep Color</strong> writes <code>escaped</code>.
        </p>
        <div id="preview" class="preview" aria-live="polite"></div>
       
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
